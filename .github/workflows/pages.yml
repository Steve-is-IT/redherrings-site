name: Deploy site to Pages

# Replaces the default "deploy from a branch" Pages build. A single concurrency
# group means rapid successive pushes no longer pile up and time out in
# syncing_files: one deploy runs, newer queued ones supersede it, and an
# in-progress production deploy is allowed to finish.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Publish the tracked site files only: the writers' notes (AGENTS.md),
      # the README, the tools-* generators and the PDF renderer stay in the repo.
      - name: Stage the public files
        run: |
          mkdir _site
          git ls-files -z \
            | grep -zvE '^(AGENTS\.md|README\.md|tools-[^/]*|print/render\.py|\.github/.*)$' \
            | tar --null -T - -cf - | tar -xf - -C _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
